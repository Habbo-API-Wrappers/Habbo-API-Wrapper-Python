[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wired-api-python"
version = "0.1.2"
description = "A Python port of Habbo-API-Wrappers/Habbo-API-Wrapper-PHP -- a lightweight wrapper for the Habbo public API and WIRED variable endpoints."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "WiredSpast" },
]
requires-python = ">=3.9"
keywords = ["habbo", "api", "wrapper", "wired"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.25",
]

[project.urls]
"Original PHP project" = "https://github.com/Habbo-API-Wrappers/Habbo-API-Wrapper-PHP"

[tool.setuptools.packages.find]
where = ["src"]
include = ["wired_api_python*"]
